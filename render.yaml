databases:
  - name: skyline-crm-db
    databaseName: realestate_crm
    user: crm_user
    plan: free

services:
  - type: web
    name: skyline-crm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && node -e "require('fs').rmSync('tsconfig.build.tsbuildinfo',{force:true})" && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skyline-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # Set this manually after Vercel gives you the URL
